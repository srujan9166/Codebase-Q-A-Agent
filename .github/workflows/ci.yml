name: CI/CD Pipeline - Codebase Q&A Agent

# Trigger this workflow whenever code is pushed to 'main' or a Pull Request is opened
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ===================================================
  # Job 1: Test & Build Frontend
  # ===================================================
  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codebase-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./codebase-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build React SPA
        run: npm run build

  # ===================================================
  # Job 2: Test & Build Backend
  # ===================================================
  build-backend:
    name: Build Backend (Java 21 + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codebase-agent

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Compile and Package (Skip integration tests on CI without DB)
        run: ./mvnw clean package -DskipTests

   # ===================================================
  # Job 3: Build & Publish Docker Images to GHCR Shelf
  # ===================================================
  docker-publish:
    name: Build & Push Images to GitHub Registry
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Gives the factory permission to store on the shelf

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Log in to GitHub's Container Supermarket
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Build & Push Backend Box
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./codebase-agent
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/codebase-backend:latest

      # Step 3: Build & Push Frontend Box
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./codebase-frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/codebase-frontend:latest

