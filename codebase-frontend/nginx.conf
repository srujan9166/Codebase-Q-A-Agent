server {
    listen 80;
    server_name localhost;

    # 1. Serve static React build files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential for Single Page Apps (SPA):
        # If user refreshes on a sub-route, fallback to index.html instead of 404
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy for Backend API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support large zip uploads (matches Spring Boot 500MB config)
        client_max_body_size 500M;
    }

    # 3. Support Server-Sent Events (SSE) for Spring AI MCP streaming
    location /mcp/ {
        proxy_pass http://backend:8080/mcp/;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }
}
