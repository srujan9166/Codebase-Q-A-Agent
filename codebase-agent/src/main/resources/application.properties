spring.application.name=codebase-agent

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect




# Gemini
 spring.ai.google.genai.chat.options.model=gemini-3.6-flash

spring.ai.google.genai.embedding.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.options.dimensions=768
spring.ai.google.genai.embedding.text.dimensions=768

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.project-id=${GCP_PROJECT_ID}
spring.ai.google.genai.embedding.project-id=${GCP_PROJECT_ID}
spring.ai.google.genai.embedding.location=${GCP_LOCATION}


# spring.ai.google.genai.chat.options.model=gemini-3.5-flash


spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=true

# Multipart Upload Limits (Increase max allowed zip file size)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Enable MCP Server
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=codebase-qa-agent
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.transport=webmvc-sse

