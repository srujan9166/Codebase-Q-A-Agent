spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/codebase_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local Gemini API Key (reads from your local .env)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.project-id=${GCP_PROJECT_ID:623084248207}
spring.ai.google.genai.embedding.project-id=${GCP_PROJECT_ID:623084248207}
spring.ai.google.genai.embedding.location=${GCP_LOCATION:us-central1}
